name = "creativity-ai"
main = "workers/creativity-ai.js"
compatibility_date = "2026-07-11"
preview_urls = false

[ai]
binding = "AI"

# Crie o namespace com: npx wrangler kv namespace create LIMITS
# Depois descomente e preencha o id retornado:
[[kv_namespaces]]
binding = "LIMITS"
id = "adac5c76f1ce44d384749bcc43e15802"

[vars]
ALLOWED_ORIGINS = "https://deutschbloom.com,https://www.deutschbloom.com,http://localhost:8081"

[observability]
enabled = true

[observability.logs]
enabled = true
